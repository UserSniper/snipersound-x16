
MEMORY {
    REGS:   start = $02,size = $20, type = rw,  define = yes;
    ZP:     start = $24,size = $5c, type = rw,  define = yes;

    HIRAM:    start = $a000,  size = $1fc0, type = rw,  define = yes;
    BUF:      start = $bfc0,  size = $0040, type = rw,  define = yes;
}



SEGMENTS {
    JUMPTABLE:  load = HIRAM,   type = rw, define = yes;
    CODE:       load = HIRAM,   type = rw, define = yes;
    RODATA:     load = HIRAM,   type = rw, define = yes;


    BSS:        load = HIRAM,   type = bss, define = yes;
    BUFFER:     load = BUF,     type = bss, define = yes;
    REGISTERS:  load = REGS,    type = zp,  define = yes;
    ZEROPAGE:   load = ZP,      type = zp,  define = yes;
}